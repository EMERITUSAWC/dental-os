{% extends "base.html" %}
{% block title %}{{ _("Change password") }}{% endblock %}
{% block body %}
<section class="card login">
  <h1>{{ _("Change your password") }}</h1>
  {% if forced %}<p>{{ _("You are using a temporary password. Choose your own to carry on.") }}</p>{% endif %}
  {% if error %}<div class="flash error" role="alert">{{ _(error) }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="current">{{ _("Current password") }}</label><input id="current" name="current" type="password" autocomplete="current-password" required>
    <label for="new">{{ _("New password (10 characters or more)") }}</label><input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required>
    <label for="again">{{ _("New password again") }}</label><input id="again" name="again" type="password" autocomplete="new-password" minlength="10" required>
    <p><button class="primary" type="submit">{{ _("Change password") }}</button></p>
  </form>
</section>
{% endblock %}
