{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block body %}
<section class="card login">
  <h1>Change your password</h1>
  {% if forced %}<p>You are using a temporary password. Choose your own to carry on.</p>{% endif %}
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="current">Current password</label><input id="current" name="current" type="password" autocomplete="current-password" required>
    <label for="new">New password (10 characters or more)</label><input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required>
    <label for="again">New password again</label><input id="again" name="again" type="password" autocomplete="new-password" minlength="10" required>
    <p><button class="primary" type="submit">Change password</button></p>
  </form>
</section>
{% endblock %}
